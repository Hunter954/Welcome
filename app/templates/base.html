<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Instagram Welcome' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold"><i class="bi bi-instagram me-2"></i>Instagram Welcome</span>{% if session.get('admin') %}<a href="{{ url_for('admin_logout') }}" class="btn btn-outline-light btn-sm">Sair</a>{% endif %}</div></nav>
<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
